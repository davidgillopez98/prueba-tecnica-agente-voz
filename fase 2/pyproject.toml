[project]
name = "test-pipecat"
version = "0.1.0"
description = "Prototipo de apertura de siniestros con Pipecat y servicios mock"
readme = "README.md"
authors = [
    { name = "DavidGL-UC3M", email = "100363815@alumnos.uc3m.es" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pipecat-ai[deepgram,websocket]>=1.12.0",
    "pydantic-settings>=2.15.0",
    "sounddevice>=0.5.6",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
